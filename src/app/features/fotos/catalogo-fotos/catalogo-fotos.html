<section id="catalogo-main">
    <section class="catalogo-header">
        <span class="categoria-label">
            OÁSIS PHOTOGRAPHY
        </span>
        <h1 class="titulo-pagina">
            Álbuns 
        </h1>
        <p class="subtitulo-pagina">
            Explore nossos trabalhos e conheça diferentes momentos
            registrados através da fotografia.
        </p>
    </section>

    


    <section class="resultado-info">
       
    </section>

    <section class="grid-galeria">
        @for (foto of fotos(); track foto.id) {
            <app-foto [id]="foto.id"  [url]="foto.url">

            </app-foto>
        }
    </section>

</section>
