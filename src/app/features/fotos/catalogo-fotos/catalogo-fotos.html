
<section class="filtros">

    <button mat-button (click)="filtrar('todos')">Todos</button>
    <button mat-button (click)="filtrar('casamento')">Casamento</button>
    <button mat-button (click)="filtrar('gestante')">Gestante</button>
    <button mat-button (click)="filtrar('família')">Família</button>
    <button mat-button (click)="filtrar('corporativo')">Corporativo</button>
    <button mat-button (click)="filtrar('eventos')">Eventos</button>
    <button mat-button (click)="filtrar('infatil')">Infantil</button>
</section>

<section class="galeria-container">
    <section class="secao-titulo">
        <h1 class="titulo-pagina">Álbuns & Portfólio</h1>
        <p class="subtitulo-pagina">Explore os momentos capturados com paixão e criatividade. Cada álbum é uma história única, repleta de emoções e memórias inesquecíveis.</p>
    </section>

    <section class="grid-galeria">
        @for (foto of fotosFiltradas(); track $index) {
            <mat-card>
                <section class="card-img-container">
                    <img mat-card-image [src]="foto.url" [alt]="foto.titulo">
                    <section class="overlay-categoria">
                        <span class="badge">{{ foto.categoria }}</span>
                    </section>
                </section>

                <mat-card-content class="card-content">
                    <mat-card-title class="card-tittle">{{ foto.titulo }}</mat-card-title>
                    
                </mat-card-content>
            </mat-card>
        }
    </section>
</section>
